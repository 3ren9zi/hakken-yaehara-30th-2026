name: GitHub Pagesへ公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ファイルを取得
        uses: actions/checkout@v6
      - name: Node.jsを準備
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: 公開用ファイルを生成
        run: node build.cjs
      - name: GitHub Pagesを準備
        uses: actions/configure-pages@v5
      - name: 公開用ファイルをアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4
